<svg xmlns="http://www.w3.org/2000/svg" width="450" height="176" viewBox="0 0 450 176" font-family="Menlo, Consolas, monospace" font-size="12">
  <style>
    .label { fill: #6e7681; }
    .count { fill: #6e7681; }
    .bar { fill: #E8A33D; transform-box: fill-box; transform-origin: left;
            animation: grow 0.8s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @media (prefers-color-scheme: dark) {
      .label { fill: #8b949e; }
      .count { fill: #8b949e; }
    }
  </style>
  <text x="0" y="21" class="label">Python</text><rect x="130" y="10" width="260" height="12" rx="2" class="bar" style="animation-delay:0.0s" /><text x="400" y="21" class="count">22</text><text x="0" y="47" class="label">C++</text><rect x="130" y="36" width="83" height="12" rx="2" class="bar" style="animation-delay:0.12s" /><text x="400" y="47" class="count">7</text><text x="0" y="73" class="label">Jupyter Notebook</text><rect x="130" y="62" width="83" height="12" rx="2" class="bar" style="animation-delay:0.24s" /><text x="400" y="73" class="count">7</text><text x="0" y="99" class="label">Go</text><rect x="130" y="88" width="35" height="12" rx="2" class="bar" style="animation-delay:0.36s" /><text x="400" y="99" class="count">3</text><text x="0" y="125" class="label">Rust</text><rect x="130" y="114" width="24" height="12" rx="2" class="bar" style="animation-delay:0.48s" /><text x="400" y="125" class="count">2</text><text x="0" y="151" class="label">HTML</text><rect x="130" y="140" width="24" height="12" rx="2" class="bar" style="animation-delay:0.6s" /><text x="400" y="151" class="count">2</text>
</svg>